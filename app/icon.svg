<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Daily Engineering News">
  <!-- Substack orange tile; the mark reads as a short list of headlines, which is
       literally what the site is. Deliberately only three bars: at 16px in a tab strip
       anything finer collapses into texture. -->
  <rect width="32" height="32" rx="7.5" fill="#ff6719"/>
  <g fill="#fff">
    <rect x="7" y="9"    width="18" height="2.8" rx="1.4"/>
    <rect x="7" y="14.6" width="12" height="2.8" rx="1.4" opacity="0.92"/>
    <rect x="7" y="20.2" width="15" height="2.8" rx="1.4" opacity="0.84"/>
  </g>
</svg>
